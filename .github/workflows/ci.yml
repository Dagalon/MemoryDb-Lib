name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore MSBuild/MemoryDb-Lib.sln

      - name: Build solution
        run: dotnet build MSBuild/MemoryDb-Lib.sln -c Release --no-restore

      - name: Test solution
        run: dotnet test MSBuild/MemoryDb-Lib.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  pack:
    name: Pack NuGet
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack NuGet
        run: dotnet pack Memory-Db/Memory-Db.csproj -c Release -o ./Artifacts

      - name: Verify package
        shell: pwsh
        run: Get-ChildItem -Path Artifacts -Filter *.nupkg

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./Artifacts/*.nupkg
          if-no-files-found: error

  deploy-addin:
    name: Deploy Excel add-in artifact
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Excel add-in
        shell: pwsh
        run: ./scripts/deploy.ps1 -Configuration Release -ArtifactsDir Artifacts

      - name: Verify Excel add-in files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path Artifacts/addin -Recurse -Include *.xll,*.dna
          if (-not $files) { throw "No Excel add-in files were generated in Artifacts/addin." }
          $files | Format-Table FullName, Length

      - name: Upload Excel add-in
        uses: actions/upload-artifact@v4
        with:
          name: excel-addin
          path: ./Artifacts/addin/**
          if-no-files-found: error
